# Journals/publishers to boost (badge + ranked higher). Others still appear.
preferred_venues:
  journals: ["Journal of Fluid Mechanics", "Langmuir", "Nanoscale", "Physics of Fluids", "Soft Matter"]
  publishers: ["Royal Society of Chemistry", "American Chemical Society"]

ai:
  # Tried in order; the first one that answers is used.
  models: ["google/gemma-4-31b-it", "nvidia/nemotron-3-ultra-550b-a55b",
           "minimaxai/minimax-m3.1-flash", "mistralai/mistral-large-4-1t-a52b",
           "nvidia/nemotron-3.5-lightning-30b-a3b"]
  batch_size: 8          # papers per AI request
  parallel_requests: 3   # stays well under NVIDIA's free rate limit
  high_score: 8          # >= this: "Highly relevant"
  keep_score: 5          # >= this: "Possibly relevant"; below is dropped

run:
  first_run_days: 90     # how far back the very first run looks
  window_days: 45        # each daily run re-checks this many days (late-indexed papers)
  email_max_high: 60     # max "highly relevant" papers listed in one email
  email_max_maybe: 60
  email_max_authors: 40
