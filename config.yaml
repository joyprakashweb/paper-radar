# ---------------------------------------------------------------
#  Paper Radar settings
#  Edit this file on GitHub (pencil icon) to change what is tracked.
#  Keys and passwords are NOT stored here; they live in the repo's
#  Settings -> Secrets and variables -> Actions.
# ---------------------------------------------------------------

topic:
  # The AI reads this to judge whether a paper fits your research.
  description: >
    My research primarily focuses on electrokinetic phenomena at micro- and
    nanoscales, including the fundamental mechanisms, interactions, and
    combined effects of various electrokinetic, diffusio-kinetic, and
    thermally driven transport phenomena. These include their investigation
    in microchannels, nanochannels, and nanopore systems connected to
    reservoirs, with an emphasis on understanding coupled transport processes
    and their potential applications. I am particularly interested in
    translating these fundamental studies into practical technologies such as
    energy harvesting, water desalination, electrodialysis, reverse
    electrodialysis, DNA sequencing, and the development of novel biomedical
    devices.
  # Things that share keywords with the topic but are NOT wanted.
  exclude: >
    Papers that only use electrophoresis as a routine lab assay (gel
    electrophoresis, SDS-PAGE, western blot, capillary electrophoresis for
    chemical analysis); genomics or microbiology studies that merely use
    nanopore (Oxford Nanopore) sequencing as a tool; biological chemiosmosis
    in mitochondria or cells; aerosol or combustion thermophoresis and
    microscale-thermophoresis binding assays; piezoelectric, triboelectric or
    solar energy harvesting; membrane or materials papers with no transport
    physics; geophysical streaming potential studies.

# Keyword searches (arXiv + journals via OpenAlex). A paper is a candidate
# if it matches ANY query. In a query, "any" terms are OR-ed; if "and_any"
# is given, the paper must also contain one of those terms.
queries:
  - name: Core electrokinetic and phoretic phenomena
    any: [electrokinetic, electrokinetics, electroosmosis, electroosmotic,
          "electro-osmosis", "electro-osmotic", diffusioosmosis, diffusioosmotic,
          "diffusio-osmosis", "diffusio-osmotic", diffusiophoresis, diffusiophoretic,
          chemiphoresis, chemiphoretic, thermoelectrophoresis, "thermo-electrophoresis",
          thermoelectroosmosis, "thermo-electroosmosis", "thermo-electroosmotic",
          nanofluidic, nanofluidics, nanochannel, nanochannels,
          "reverse electrodialysis", "streaming potential", "streaming current",
          "ionic current rectification", "Poisson-Nernst-Planck",
          "osmotic energy", "osmotic power", "salinity gradient energy",
          "salinity gradient power", "blue energy", "solid-state nanopore",
          "ion concentration polarization"]
  - name: Transport in nanopores and microchannels
    any: [nanopore, nanopores, microchannel, microchannels, nanoslit, nanoslits,
          microfluidic, microfluidics, "nanoporous membrane", "ion exchange membrane"]
    and_any: [electrophoresis, electrophoretic, thermophoresis, thermophoretic,
              chemiosmosis, chemiosmotic, "electric double layer", "double layer",
              "Debye layer", "surface charge", "zeta potential", "ion transport",
              "ionic transport", "ion selectivity", "ionic selectivity", "ionic current",
              "concentration gradient", "salinity gradient", "temperature gradient",
              "thermal gradient", "electrochemical transport", "energy harvesting",
              "power generation", desalination, electrodialysis, "DNA sequencing",
              "DNA translocation", translocation]
  - name: Phoresis of colloids and particles
    any: [electrophoresis, electrophoretic, thermophoresis, thermophoretic, Soret]
    and_any: [colloid, colloidal, colloids, "soft particle", "double layer",
              "Debye length", "Debye layer"]

